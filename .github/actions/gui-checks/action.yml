name: Build and verify the TurboWarp host
description: Own shared distribution, host verification and scoped E2E orchestration.
inputs:
  mode:
    description: ci or pages
    default: ci
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: turbowarp-extension-data-editor/.nvmrc
        cache: npm
        cache-dependency-path: scratch-gui/package-lock.json
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: turbowarp-extension-data-editor/package.json
        run_install: false
    - name: Build and verify the shared distribution
      id: core
      shell: bash
      working-directory: turbowarp-extension-data-editor
      run: |
        pnpm install --frozen-lockfile
        pnpm typecheck
        pnpm test
        pnpm test:e2e:infrastructure
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Select host regression scope
      id: scope
      shell: bash
      working-directory: turbowarp-extension-data-editor
      env:
        E2E_GUI_ROOT: ${{ github.workspace }}/scratch-gui
        CHECK_MODE: ${{ inputs.mode }}
      run: |
        if [ "$CHECK_MODE" = pages ]; then
          echo 'run=true' >> "$GITHUB_OUTPUT"
        elif [ "$CHECK_MODE" = ci ]; then
          node test/e2e/turbowarp/ci-scope.cjs
        else
          echo 'Unsupported mode' >&2
          exit 1
        fi
    - name: Prepare the host and verify its integration
      shell: bash
      working-directory: scratch-gui
      env:
        EXPECTED_CORE_REVISION: ${{ steps.core.outputs.revision }}
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        node -e "const info = require('@kubohiroya/turbowarp-extension-data-editor/build-info'); if (info.revision !== process.env.EXPECTED_CORE_REVISION) throw new Error('Installed editor source does not match the pinned workflow source.');"
        node scripts/prepublish.mjs
        npm run test:block-editor
        node --test ../turbowarp-extension-data-editor/test/site/*.test.cjs
    - name: Verify upstream addon tests
      if: inputs.mode == 'ci'
      shell: bash
      working-directory: scratch-gui
      run: npm run test:unit
    - name: Build the host once
      shell: bash
      working-directory: scratch-gui
      env:
        CHECK_MODE: ${{ inputs.mode }}
        E2E_SELECTED: ${{ steps.scope.outputs.run }}
        BUILD_REVISION: ${{ github.sha }}
        NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=6144
      run: |
        if [ "$CHECK_MODE" = pages ]; then
          E2E_GUI_ROOT="$PWD" ROOT=/scratch-gui/ node ../turbowarp-extension-data-editor/scripts/site/build.mjs
        elif [ "$E2E_SELECTED" = true ]; then
          ROOT=/scratch-gui/ NODE_ENV=production npm run build
          E2E_GUI_ROOT="$PWD" node ../turbowarp-extension-data-editor/test/e2e/turbowarp/prepare-build.cjs
        else
          npm run build
        fi
    - name: Install the test browser
      if: steps.scope.outputs.run == 'true'
      shell: bash
      working-directory: turbowarp-extension-data-editor
      run: pnpm exec playwright install --with-deps chromium
    - name: Verify editor UI and real sb3 roundtrip
      if: steps.scope.outputs.run == 'true'
      shell: bash
      working-directory: turbowarp-extension-data-editor
      env:
        E2E_GUI_ROOT: ${{ github.workspace }}/scratch-gui
        E2E_EXPECT_GUI_REVISION: ${{ github.sha }}
      run: |
        export E2E_EXPECT_CORE_REVISION="$(git rev-parse HEAD)"
        pnpm test:e2e:block-editor
    - name: Preserve host verification evidence
      if: always() && steps.scope.outputs.run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: block-editor-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          turbowarp-extension-data-editor/test-results/block-editor/
          turbowarp-extension-data-editor/playwright-report/block-editor/
        retention-days: 7
        if-no-files-found: warn
