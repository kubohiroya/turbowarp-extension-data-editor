name: Verify a published TurboWarp host
on:
  workflow_call:
    inputs:
      runner_revision:
        type: string
        required: true
      expected_revision:
        type: string
        default: ''
      base_url:
        type: string
        default: https://kubohiroya.github.io/turbowarp-extension-data-editor/
permissions:
  contents: read
  deployments: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: turbowarp-extension-data-editor
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kubohiroya/turbowarp-extension-data-editor
          ref: ${{ inputs.runner_revision }}
          path: turbowarp-extension-data-editor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Resolve expected deployment and pinned core
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          PUBLIC_BASE_URL: ${{ inputs.base_url }}
        run: node test/e2e/turbowarp/public-target.cjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the expected published revision
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
          E2E_EXPECT_GUI_REVISION: ${{ steps.target.outputs.gui_revision }}
          E2E_EXPECT_CORE_REVISION: ${{ steps.target.outputs.core_revision }}
          E2E_EXPECT_SITE_REVISION: ${{ steps.target.outputs.site_revision }}
        run: node test/e2e/turbowarp/wait-public.cjs
      - name: Verify public UI and real sb3 roundtrip
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
          E2E_EXPECT_GUI_REVISION: ${{ steps.target.outputs.gui_revision }}
          E2E_EXPECT_CORE_REVISION: ${{ steps.target.outputs.core_revision }}
          E2E_EXPECT_SITE_REVISION: ${{ steps.target.outputs.site_revision }}
        run: pnpm test:e2e:block-editor
      - name: Preserve public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-editor-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            turbowarp-extension-data-editor/test-results/block-editor/
            turbowarp-extension-data-editor/test-results/block-editor-deployment/
            turbowarp-extension-data-editor/playwright-report/block-editor/
          retention-days: 7
          if-no-files-found: warn
