name: Publish extended editor site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'kubohiroya/turbowarp-extension-data-editor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: turbowarp-extension-data-editor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false
      - name: Verify main and pinned GUI CI
        id: source
        working-directory: turbowarp-extension-data-editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/site/source.mjs
      - uses: actions/checkout@v4
        with:
          repository: kubohiroya/scratch-gui
          ref: ${{ steps.source.outputs.gui_revision }}
          path: scratch-gui
          persist-credentials: false
      - name: Prepare and test the pinned host
        working-directory: scratch-gui
        run: |
          npm ci --no-audit --no-fund
          node scripts/prepublish.mjs
          npm run test:block-editor
          npm run test:unit
      - name: Build the site from the common repository
        working-directory: turbowarp-extension-data-editor
        env:
          E2E_GUI_ROOT: ${{ github.workspace }}/scratch-gui
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node --test test/site/*.test.cjs
          node scripts/site/build.mjs
          pnpm exec playwright install --with-deps chromium
          E2E_PATH_PREFIX=/turbowarp-extension-data-editor/ pnpm test:e2e:block-editor
      - uses: actions/upload-pages-artifact@v4
        with:
          path: scratch-gui/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-build-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            turbowarp-extension-data-editor/test-results/
            turbowarp-extension-data-editor/playwright-report/
          retention-days: 7
  ci-gate:
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/require-successful-ci.yml
    with:
      runner_revision: ${{ github.sha }}
      expected_revision: ${{ github.sha }}
      workflow_file: ci.yml
      branch: main
      event: push
  deploy:
    needs: [build, ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck main and pinned GUI CI immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/site/source.mjs
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/site-source/
          retention-days: 7
  verify-public:
    needs: deploy
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/turbowarp-public.yml
    with:
      runner_revision: ${{ github.sha }}
      expected_revision: ${{ github.sha }}
      base_url: https://kubohiroya.github.io/turbowarp-extension-data-editor/
