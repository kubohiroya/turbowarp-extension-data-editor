name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: node --test test/ci/*.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test test/e2e/layout/dialog-window.ts
      # Integration with the TurboWarp Plus Editor's pinned VM and Scratch Blocks, on the minimal editor runtime.
      - run: pnpm run test:runtime
