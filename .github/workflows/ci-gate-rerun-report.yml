name: Verify scheduled CI attempts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actual scheduled source run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-weekly-report-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'kubohiroya/turbowarp-extension-data-editor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the completed schedule and its evidence
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: node scripts/ci/report-weekly-ci.mjs verify
      - name: Preserve verification without publication credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-weekly-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-weekly-report/
          retention-days: 7
      - name: Explain reporting scope
        if: always()
        run: |
          echo 'Verification is read-only. A separate opt-in job records results in the common operations Issue.' >> "$GITHUB_STEP_SUMMARY"
  record:
    needs: verify
    if: always() && needs.verify.outputs.eligible == 'true' && vars.CI_RERUN_REPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: ci-weekly-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-report
      - name: Record in this repository's operations Issue
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RERUN_REPORT_ENABLED: ${{ vars.CI_RERUN_REPORT_ENABLED }}
        run: node scripts/ci/post-local-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-weekly-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-weekly-publication/
          retention-days: 7
